# =====================================================================
# NPC CHARACTER SHEET  -  schema v0.1
# ---------------------------------------------------------------------
# REQUIRED fields must be filled before the framework will load the NPC.
# OPTIONAL fields can be left as ~ (blank); the pipeline handles them.
#
# Writing tips (apply to every prose field):
#   - Write in third person, plain language ("Eric is...", not "I am...").
#   - Describe who the character IS, not how hard to act it.
#     Avoid intensity words like VERY, ALWAYS, NEVER, EXTREMELY.
#   - Do NOT list items, prices or quest steps here. The game supplies
#     those at runtime. Lore about the world goes in the lorebook.
#   - Each prose field has "Consider:" prompts. You don't have to answer
#     them all, but the more you cover, the more consistent the NPC.
# =====================================================================

schema_version: 0.1
id: ""                    # REQUIRED. Unique, lowercase, no spaces. e.g. "eric_blacksmith"

# ---------------------------------------------------------------------
# 1. IDENTITY
# ---------------------------------------------------------------------
name: ""                  # REQUIRED. What other characters call them.
age: ""                   # REQUIRED. A number or a description ("late fifties", "ancient").
gender: ~                 # OPTIONAL.
race: ~                   # OPTIONAL. In-world race or people (e.g. Nord, Dunmer, human).
species: ~                # OPTIONAL. (e.g. human, elf, beast-folk). Leave blank if same as race.

# ---------------------------------------------------------------------
# 2. ROLE  (REQUIRED, 1-3 sentences)
# Their function in the game world and what they mean to the player.
# Consider: their job or position; where they are usually found;
#           what the player typically comes to them for.
# ---------------------------------------------------------------------
role: |
  *Sample Text*


# ---------------------------------------------------------------------
# 3. APPEARANCE  (REQUIRED, 2-5 sentences)
# Consider: build and posture; face, hair, notable marks; clothing;
#           anything they always carry; how they look to a stranger.
# ---------------------------------------------------------------------
appearance: |
  *Sample Text*


# ---------------------------------------------------------------------
# 4. PERSONALITY  (REQUIRED, free prose, ~3-8 sentences)
# Consider: general temperament; how they treat strangers vs people
#           they trust; what they value; what annoys them;
#           one quirk, habit or contradiction that makes them human.
# ---------------------------------------------------------------------
personality: |
  *Sample Text*


# ---------------------------------------------------------------------
# 5. BACKGROUND  (REQUIRED, free prose, as long as you like)
# Write this like a short biography.
# Consider: where they come from; how they ended up in their role;
#           key past events; important people in their life (by name);
#           their current situation and any recent events.
# ---------------------------------------------------------------------
background: | 
  *Sample Text*


# ---------------------------------------------------------------------
# 6. SPEECH STYLE  (OPTIONAL, 1-2 sentences)
# Consider: formal or casual; long or short sentences; accent or
#           dialect; favourite expressions; what they avoid saying.
# If blank, the NPC's voice is taken from the example dialogue.
# ---------------------------------------------------------------------
speech_style: ~

# ---------------------------------------------------------------------
# 7. KNOWLEDGE  (OPTIONAL but recommended)
# knowledge: TOPICS they know well, in prose. Not item lists.
# knowledge_boundaries: things outside their world or experience, and
#   how they react to them. Phrase it in-world ("has never heard of
#   it and reacts with confusion"), not as a rule about the game.
# ---------------------------------------------------------------------
knowledge: ~

knowledge_boundaries: ~

# ---------------------------------------------------------------------
# 8. EXAMPLE DIALOGUE  (REQUIRED, at least 2 exchanges, ideally 3)
# Short exchanges showing HOW the character talks. NPC lines should be
# 1-2 sentences, as you'd want them in-game.
# Recommended mix:
#   - one ordinary exchange tied to their role
#   - one personal question (name, past, opinion)
#   - one question about something they shouldn't know (shows the boundary)
# context is optional: one line setting the scene.
# ---------------------------------------------------------------------
example_dialogue:
  - context: ~
    player: ""
    npc: ""
  - context: ~
    player: ""
    npc: ""

# =====================================================================
# 9. ADVANCED / ENGINE SETTINGS  (OPTIONAL)
# Read by the framework engine, not shown to the model as prose.
# Leave blank to use defaults.
# =====================================================================
secrets: []               # Each: {text: "...", reveal_condition: "<world-state expression>"}
allowed_actions: []       # Names from the game's action registry, e.g. [sell_item, refuse]. Blank = role default.
temper: ~                 # calm | normal | short   (sets disposition thresholds)